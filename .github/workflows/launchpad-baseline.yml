name: BuildBench Launchpad builder replay
run-name: Launchpad builder ${{ inputs.case }}
on:
  workflow_dispatch:
    inputs:
      case:
        description: "Case with a recovered chroot and recorded Launchpad builder source"
        required: true
      historical_kernel:
        description: "Use an isolated VM with the recovered original kernel"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  select:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      runner: ${{ steps.select.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: select
        env:
          CASE_ID: ${{ inputs.case }}
        run: |
          runner=$(python3 scripts/launchpad_baseline.py runner "$CASE_ID")
          printf 'runner=%s\n' "$runner" >>"$GITHUB_OUTPUT"
  replay:
    needs: select
    runs-on: ${{ needs.select.outputs.runner }}
    timeout-minutes: 355
    env:
      CASE_ID: ${{ inputs.case }}
      HISTORICAL_KERNEL: ${{ inputs.historical_kernel }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify frozen inputs and historical chroot
        run: |
          options=()
          if [[ "$HISTORICAL_KERNEL" == true ]]; then
            options+=(--historical-kernel)
          fi
          python3 scripts/launchpad_baseline.py prepare "$CASE_ID" "$RUNNER_TEMP/launchpad-input" "${options[@]}"
      - name: Install the historical sbuild tool and Launchpad wrapper
        run: |
          set -euo pipefail
          host="$RUNNER_TEMP/launchpad-host"
          settings="$RUNNER_TEMP/launchpad-input/launchpad-settings.json"
          revision=$(jq -er .builder.commit "$settings")
          image=$(jq -er .host_image "$settings")
          sbuild=$(jq -er .historical_host_toolchain.sbuild "$settings")
          [[ "$revision" =~ ^[a-f0-9]{40}$ && "$sbuild" =~ ^[a-zA-Z0-9.+~-]+$ ]]
          mkdir -p "$host/sbuild-debs"
          git init --quiet "$host/upstream"
          git -C "$host/upstream" fetch --quiet --depth 1 https://git.launchpad.net/launchpad-buildd "$revision"
          git -C "$host/upstream" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$host/upstream" rev-parse HEAD)" = "$revision"
          for piece in sbuild libsbuild-perl; do
            package="${piece}_${sbuild}_all.deb"
            curl -fsSL --retry 3 "https://launchpad.net/ubuntu/+archive/primary/+files/$package" \
              -o "$host/sbuild-debs/$package"
            file="$host/sbuild-debs/$package"
            test "$(dpkg-deb -f "$file" Package)" = "$piece"
            test "$(dpkg-deb -f "$file" Version)" = "$sbuild"
            dpkg-deb --fsys-tarfile "$file" | tar -tf - >/dev/null
          done
          cp scripts/run_launchpad_host.sh "$host/"
          docker build -f scripts/launchpad-host.Dockerfile -t buildbench-launchpad-host \
            --build-arg "HOST_IMAGE=$image" --build-arg "SBUILD_VERSION=$sbuild" "$host"
      - name: Run Launchpad sbuild and compare its raw output
        run: |
          input="$RUNNER_TEMP/launchpad-input"
          case_root="$input/$CASE_ID"
          evidence="$RUNNER_TEMP/launchpad-evidence"
          mkdir "$evidence"
          settings="$input/launchpad-settings.json"
          cp "$settings" "$evidence/"
          if [[ "$HISTORICAL_KERNEL" == true ]]; then
            bash scripts/run_launchpad_vm.sh "$input" "$case_root" "$evidence"
            code=$(cat "$evidence/sbuild.exit")
          else
            mapfile -t args < <(jq -r '.build_id,.architecture,.distribution,.jobs,.mode,.recipe,.maintainer' "$settings")
            host=$(jq -r .hostname "$settings")
            chroot=$(jq -r .chroot.file "$settings")
            code=0
            set +e
            docker run --rm --privileged --network none --hostname "$host" \
              --add-host "$host:127.0.0.1" --add-host "$host.buildd:127.0.0.1" \
              --mount "type=bind,src=$case_root/source/input,dst=/input/source,readonly" \
              --mount "type=bind,src=$case_root/dependencies,dst=/input/dependencies,readonly" \
              --mount "type=bind,src=$input/$chroot,dst=/input/chroot,readonly" \
              --mount "type=bind,src=$input/launchpad-pins,dst=/input/apt-pins,readonly" \
              buildbench-launchpad-host "${args[@]}" 2>&1 | tee "$evidence/build.log"
            code=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$code" >"$evidence/sbuild.exit"
          fi
          python3 scripts/launchpad_baseline.py compare "$case_root" "$evidence/build.log" "$code" "$evidence/exact-result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launchpad-evidence-${{ inputs.case }}
          path: ${{ runner.temp }}/launchpad-evidence/
