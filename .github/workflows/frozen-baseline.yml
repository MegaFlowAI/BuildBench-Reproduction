name: BuildBench frozen baselines
run-name: Frozen baseline ${{ inputs.selection }}
on:
  workflow_dispatch:
    inputs:
      selection:
        description: "Published case ID, comma-separated IDs, arm64, amd64, or all"
        required: true
        default: all
permissions:
  contents: read
jobs:
  select:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.cases.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: cases
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTION: ${{ inputs.selection }}
        run: |
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/frozen-cases-v1" --jq '.id')
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" > "$RUNNER_TEMP/release-assets.json"
          matrix=$(python3 scripts/frozen_release.py matrix "$SELECTION" --release-assets "$RUNNER_TEMP/release-assets.json")
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
  replay:
    name: replay (${{ matrix.case }})
    needs: select
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 355
    env:
      CASE_ID: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Release assets and load frozen runtime
        run: |
          bundle="$RUNNER_TEMP/buildbench-frozen-bundle"
          printf 'BUNDLE=%s\nWORK=%s\n' "$bundle" "$RUNNER_TEMP/buildbench-frozen-result" >> "$GITHUB_ENV"
          python3 scripts/frozen_release.py fetch "$CASE_ID" "$bundle"
      - name: Run frozen original build and compare the raw log
        run: |
          mkdir -p "$WORK"
          if [[ -f "$BUNDLE/dependency-repairs.json" ]]; then
            cp "$BUNDLE/dependency-repairs.json" "$WORK/"
          fi
          bash scripts/run_frozen_case.sh "$BUNDLE/$CASE_ID" "$WORK" "$(cat "$BUNDLE/runtime-image.txt")"
      - name: Record the reproduction result
        if: always()
        run: |
          if [[ -s "$WORK/exact-result.json" ]]; then
            {
              printf '### %s\n\n' "$CASE_ID"
              printf 'Raw log verdict: **%s**\n\n' "$(jq -r .status "$WORK/exact-result.json")"
              printf 'Package build exit: **%s**\n\n' "$(jq -r .build_exit_code "$WORK/exact-result.json")"
              printf 'First different byte: **%s**\n\n' "$(jq -r .first_difference_byte "$WORK/exact-result.json")"
              printf 'See the linked run artifact for the raw build log and events.\n'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-evidence-${{ matrix.case }}
          path: |
            ${{ runner.temp }}/buildbench-frozen-result/*.json
            ${{ runner.temp }}/buildbench-frozen-result/*.log
            ${{ runner.temp }}/buildbench-frozen-result/*.exit
            ${{ runner.temp }}/buildbench-frozen-result/result-*/build-output/build.log
            ${{ runner.temp }}/buildbench-frozen-result/result-*/build-output/build-*.json*
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-verdict-${{ matrix.case }}
          path: ${{ runner.temp }}/buildbench-frozen-result/exact-result.json
          if-no-files-found: ignore
          retention-days: 30
