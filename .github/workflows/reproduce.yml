name: BuildBench 原始构建与补丁验证
run-name: BuildBench 复现 / ${{ inputs.selection }}
on:
  workflow_dispatch:
    inputs:
      selection:
        description: "要跑的用例：单个 case ID、逗号分隔的多个 ID，或关键字：pending（待复现）/ unverified（未验证）/ pilot（试点）/ arm64 / amd64 / all（全部）。也支持中文关键字：待复现、未验证、试点、全部。"
        default: pending
        required: true
      patch_pr:
        description: "可选：公开 PR 编号（要求 selection 只填一个 case ID）。先用基线校验历史失败是否匹配，再应用 PR 里的 submissions/<case>/change.patch 验证补丁后能构建成功并产出目标架构 .deb。"
        type: string
        required: false
      variants:
        description: "是否同时跑这些用例记录的环境变体（例如 cowsql 的 fd-96/fd-104/fd-112-cpu2、alertmanager 的 single-cpu/two-go-threads、urwid 的 historical-test-order）。变体会作为独立 job 并行执行，用来触发历史 flaky 失败。"
        type: boolean
        default: false
      live_logs:
        description: "是否在 Actions 日志里实时输出编译/测试过程（默认只看摘要和附件）。调试时打开。"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.cases.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: cases
        env:
          SELECTION: ${{ inputs.selection }}
          VARIANTS: ${{ inputs.variants }}
          PATCH_PR: ${{ inputs.patch_pr }}
        run: |
          set -euo pipefail
          matrix=$(python3 scripts/select_cases.py "$SELECTION" "$VARIANTS")
          if [[ -n "$PATCH_PR" ]]; then
            [[ "$VARIANTS" == false && "$GITHUB_REF" == refs/heads/main && "$PATCH_PR" =~ ^[1-9][0-9]*$ ]]
            jq -e --arg case "$SELECTION" '.include | length == 1 and .[0].case == $case' <<< "$matrix"
          fi
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
  build:
    name: build (${{ matrix.case }}, ${{ matrix.runner }}${{ matrix.variant != '' && format(', {0}', matrix.variant) || '' }})
    needs: select
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 355
    env:
      CASE_ID: ${{ matrix.case }}
      VARIANT: ${{ matrix.variant }}
      BUILDBENCH_LIVE_LOGS: ${{ inputs.live_logs && '1' || '0' }}
      PATCH_PR: ${{ inputs.patch_pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.patch_pr != '' && '0' || '1' }}
      - name: Prepare frozen build environment
        env:
          WORK: ${{ runner.temp }}/buildbench-work
          BUILDBENCH_PREPARE_ONLY: "1"
        run: |
          set -euo pipefail
          if [[ "$BUILDBENCH_LIVE_LOGS" == 1 ]]; then
            token=$(cat /proc/sys/kernel/random/uuid)
            printf '::stop-commands::%s\n' "$token"
            trap 'printf "::%s::\n" "$token"' EXIT
          fi
          bash scripts/run_case.sh "$CASE_ID" "$WORK" "" "$VARIANT"
      - name: Run the original build and optionally validate a patch
        env:
          WORK: ${{ runner.temp }}/buildbench-work
          BUILDBENCH_ENVIRONMENT_PREPARED: "1"
        run: |
          set -euo pipefail
          patch=
          mkdir -p "$WORK/evidence"
          if [[ -n "$PATCH_PR" ]]; then
            [[ "$PATCH_PR" =~ ^[1-9][0-9]*$ ]]
            git fetch --no-tags origin "refs/pull/$PATCH_PR/head"
            sha=$(git rev-parse FETCH_HEAD)
            patch_path="submissions/$CASE_ID/change.patch"
            changed=$(git diff --no-renames --name-only "HEAD...$sha")
            if [[ "$changed" != "$patch_path" ]]; then
              echo "The PR must change only $patch_path"
              exit 1
            fi
            patch="$WORK/change.patch"
            test "$(git ls-tree "$sha" -- "$patch_path" | cut -d ' ' -f 1)" = 100644
            git show "$sha:$patch_path" > "$patch"
            test -s "$patch"
            test "$(wc -c < "$patch")" -le 1048576
            printf '%s\n' "$sha" > "$WORK/evidence/patch-commit.txt"
            sha256sum "$patch" > "$WORK/evidence/patch-sha256.txt"
          fi
          if [[ "$BUILDBENCH_LIVE_LOGS" == 1 ]]; then
            token=$(cat /proc/sys/kernel/random/uuid)
            printf '::stop-commands::%s\n' "$token"
            trap 'printf "::%s::\n" "$token"' EXIT
          fi
          bash scripts/run_case.sh "$CASE_ID" "$WORK" "$patch" "$VARIANT"
      - name: Summarize the build and historical comparison
        if: always()
        env:
          EVIDENCE: ${{ runner.temp }}/buildbench-work/evidence
        run: |
          {
            printf '### %s\n\n' "$CASE_ID"
            if [[ -n "$VARIANT" ]]; then printf 'Environment variant: %s\n\n' "$VARIANT"; fi
            if [[ -s "$EVIDENCE/baseline.exit" ]]; then
              printf -- '- Baseline command exit: **%s**\n' "$(cat "$EVIDENCE/baseline.exit")"
            else
              printf -- '- Baseline command exit: **unavailable**\n'
            fi
            if [[ -s "$EVIDENCE/baseline-result.json" ]]; then
              verdict=$(jq -r '.status' "$EVIDENCE/baseline-result.json")
              printf -- '- Historical failure comparison: **%s**\n' "$verdict"
            else
              printf -- '- Historical failure comparison: **no verdict**\n'
            fi
            if [[ -s "$EVIDENCE/patched.exit" ]]; then
              printf -- '- Patched package exit: **%s**\n' "$(cat "$EVIDENCE/patched.exit")"
            fi
            printf '\nDownload the full logs from the run artifacts.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.case }}${{ matrix.variant != '' && format('-{0}', matrix.variant) || '' }}
          path: ${{ runner.temp }}/buildbench-work/evidence/
          retention-days: 7

