name: 原始构建与补丁验证
run-name: 原始构建与补丁验证 / ${{ inputs.selection }} / patch_pr=${{ inputs.patch_pr || '无' }}
on:
  workflow_dispatch:
    inputs:
      selection:
        description: "必填：一个或多个 case ID，多个时用英文逗号分隔（逗号前后不要加空格）。"
        required: true
      patch_pr:
        description: "可选：补丁 PR 编号（只填数字）。不填时只跑 target-arch 原始构建；填了同时跑 target-arch 与 source-arch。"
        type: string
        required: false
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.cases.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: cases
        env:
          SELECTION: ${{ inputs.selection }}
          PATCH_PR: ${{ inputs.patch_pr }}
        run: |
          set -euo pipefail
          matrix=$(python3 scripts/select_cases.py "$SELECTION")
          if [[ -n "$PATCH_PR" ]]; then
            [[ "$PATCH_PR" =~ ^[1-9][0-9]*$ ]]
            python3 -c 'import json,sys; m=json.loads(sys.argv[1]); sys.exit(0 if len(m["include"])==1 else 1)' "$matrix"
          fi
          target=$(jq -c '[.include[] | . + {mode:"target"}]' <<<"$matrix")
          if [[ -n "$PATCH_PR" ]]; then
            source=$(jq -c '[.source_include[] | . + {mode:"source"}]' <<<"$matrix")
          else
            source='[]'
          fi
          merged=$(jq -c -n --argjson a "$target" --argjson b "$source" '$a + $b')
          printf 'matrix=%s\n' "$merged" >> "$GITHUB_OUTPUT"
      - name: 运行参数概览
        env:
          SELECTION: ${{ inputs.selection }}
          PATCH_PR: ${{ inputs.patch_pr }}
        run: |
          set -euo pipefail
          matrix='${{ steps.cases.outputs.matrix }}'
          {
            echo "## 运行参数"
            echo ""
            echo "- **selection**：\`$SELECTION\`"
            echo "- **patch_pr**：\`${PATCH_PR:-（未填写）}\`"
            echo "- **矩阵**：\`$matrix\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "selection=$SELECTION"
          echo "patch_pr=${PATCH_PR:-none}"
          echo "matrix=$matrix"
  build:
    name: ${{ matrix.mode }}-arch [${{ matrix.runner }}] (${{ matrix.case }})
    needs: select
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 355
    env:
      CASE_ID: ${{ matrix.case }}
      PATCH_PR: ${{ inputs.patch_pr }}
      MODE: ${{ matrix.mode }}
    steps:
      - name: 运行环境与参数
        run: |
          set -euo pipefail
          echo "case=$CASE_ID"
          echo "mode=$MODE"
          echo "patch_pr=${PATCH_PR:-none}"
          echo "runner=${{ matrix.runner }}"
          echo "arch=$(uname -m)"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 准备冻结环境（target：Release 资产 + 运行时镜像）
        if: matrix.mode == 'target'
        env:
          BUNDLE: ${{ runner.temp }}/buildbench-bundle
        run: |
          set -euo pipefail
          python3 scripts/frozen_release.py fetch "$CASE_ID" "$BUNDLE"
      - name: 准备源码包（source：只要源码 bundle）
        if: matrix.mode == 'source'
        env:
          BUNDLE: ${{ runner.temp }}/buildbench-source-bundle
        run: |
          set -euo pipefail
          python3 scripts/frozen_release.py fetch-bundle "$CASE_ID" "$BUNDLE"
      - name: 构建（可选补丁）
        env:
          WORK: ${{ runner.temp }}/buildbench-work
        run: |
          set -euo pipefail
          echo "case=$CASE_ID mode=$MODE patch_pr=${PATCH_PR:-none} runner=${{ matrix.runner }}"
          patch=
          if [[ -n "$PATCH_PR" ]]; then
            patch_path="submissions/$CASE_ID/change.patch"
            git fetch --no-tags origin "refs/pull/$PATCH_PR/head"
            sha=$(git rev-parse FETCH_HEAD)
            git show "$sha:$patch_path" > "$RUNNER_TEMP/change.patch"
            patch="$RUNNER_TEMP/change.patch"
            test -s "$patch"
          fi
          if [[ "$MODE" == "target" ]]; then
            bash scripts/run_frozen_case.sh "$RUNNER_TEMP/buildbench-bundle/$CASE_ID" "$WORK" \
              "$(cat "$RUNNER_TEMP/buildbench-bundle/runtime-image.txt")" "$patch"
          else
            bash scripts/run_source_arch.sh "$CASE_ID" "$RUNNER_TEMP/buildbench-source-bundle/$CASE_ID" "$patch"
          fi
      - name: 收集 target build.log
        if: always() && matrix.mode == 'target'
        env:
          WORK: ${{ runner.temp }}/buildbench-work
          PATCH_PR: ${{ inputs.patch_pr }}
        run: |
          set -euo pipefail
          mkdir -p "$WORK/logs"
          if [[ -n "$PATCH_PR" ]]; then
            latest=$(ls -t "$WORK"/result-patched-*/build-output/build.log 2>/dev/null | head -1 || true)
          else
            latest=$(ls -t "$WORK"/result-baseline-*/build-output/build.log 2>/dev/null | head -1 || true)
          fi
          test -n "$latest"
          cp "$latest" "$WORK/logs/build.log"
      - uses: actions/upload-artifact@v4
        if: always() && matrix.mode == 'target'
        with:
          name: build-log-${{ matrix.case }}
          path: ${{ runner.temp }}/buildbench-work/logs/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && matrix.mode == 'source'
        with:
          name: source-arch-${{ matrix.case }}
          path: |
            ${{ runner.temp }}/buildbench-source-*/source-arch-build.log
            ${{ runner.temp }}/buildbench-source-*/source-arch-build.exit
            ${{ runner.temp }}/buildbench-source-*/source-arch-binary-packages.txt
          retention-days: 7
