name: 原始构建与补丁验证
run-name: 原始构建与补丁验证 / ${{ inputs.selection || (github.ref_name == 'codex/isa-100-20261128' && 'repair-4' || 'pilot') }}
on:
  push:
    branches: [codex/isa-pilot-20261126, codex/isa-100-20261128]
    paths: ['.github/workflows/reproduce.yml', 'scripts/**', 'pilots/**', 'tests/**']
  workflow_dispatch:
    inputs:
      selection:
        description: "填 pilot 运行 10 个试点，填 arm64 运行 100 个 ARM64 目标任务，或填写英文逗号分隔的 case ID。"
        required: true
        default: pilot
      patch_pr:
        description: "可选：公开 PR 编号（只填数字，例如 12），要求上面的 selection 只填一个 case ID。"
        type: string
        required: false
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.cases.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: cases
        env:
          SELECTION: ${{ inputs.selection || (github.ref_name == 'codex/isa-100-20261128' && 'repair-4' || 'pilot') }}
          PATCH_PR: ${{ inputs.patch_pr }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          matrix=$(python3 scripts/select_cases.py "$SELECTION")
          if [[ -n "$PATCH_PR" ]]; then
            [[ "$PATCH_PR" =~ ^[1-9][0-9]*$ ]]
            python3 -c 'import json,sys; m=json.loads(sys.argv[1]); sys.exit(0 if len(m["include"])==1 else 1)' "$matrix"
          fi
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
  build:
    name: build (${{ matrix.case }})
    needs: select
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 355
    env:
      CASE_ID: ${{ matrix.case }}
      PATCH_PR: ${{ inputs.patch_pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.patch_pr != '' && '0' || '1' }}
      - name: 记录机器环境并校验官方输入
        env:
          BUNDLE: ${{ runner.temp }}/buildbench-bundle
          WORK: ${{ runner.temp }}/buildbench-work
        run: python3 scripts/collect_evidence.py start "$CASE_ID" "$WORK" "$BUNDLE"
      - name: 准备冻结环境（Release 资产 + 运行时镜像）
        env:
          BUNDLE: ${{ runner.temp }}/buildbench-bundle
          WORK: ${{ runner.temp }}/buildbench-work
        run: |
          set -euo pipefail
          python3 scripts/frozen_release.py fetch "$CASE_ID" "$BUNDLE" 2>&1 | tee "$WORK/validator-prepare.log"
          docker image inspect "$(cat "$BUNDLE/runtime-image.txt")" > "$WORK/runtime-image.json"
      - name: 原始构建（完整日志）与可选补丁验证
        env:
          BUNDLE: ${{ runner.temp }}/buildbench-bundle
          WORK: ${{ runner.temp }}/buildbench-work
          PATCH_PR: ${{ inputs.patch_pr }}
        run: |
          set -euo pipefail
          patch=
          if [[ -n "$PATCH_PR" ]]; then
            patch_path="submissions/$CASE_ID/change.patch"
            git fetch --no-tags origin "refs/pull/$PATCH_PR/head"
            sha=$(git rev-parse FETCH_HEAD)
            git show "$sha:$patch_path" > "$RUNNER_TEMP/change.patch"
            patch="$RUNNER_TEMP/change.patch"
            test -s "$patch"
            test "$(wc -c < "$patch")" -le 1048576
          fi
          bash scripts/run_frozen_case.sh "$BUNDLE/$CASE_ID" "$WORK" "$(cat "$BUNDLE/runtime-image.txt")" "$patch"
      - name: 保存判定、原始日志、环境和耗时证据
        if: always()
        env:
          BUNDLE: ${{ runner.temp }}/buildbench-bundle
          WORK: ${{ runner.temp }}/buildbench-work
        run: python3 scripts/collect_evidence.py collect "$CASE_ID" "$WORK" "$BUNDLE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.case }}
          path: ${{ runner.temp }}/buildbench-work/evidence/
          if-no-files-found: error
          retention-days: 30
      - name: 收集 build.log
        if: always()
        env:
          WORK: ${{ runner.temp }}/buildbench-work
          PATCH_PR: ${{ inputs.patch_pr }}
        run: |
          set -euo pipefail
          mkdir -p "$WORK/logs"
          if [[ -n "$PATCH_PR" ]]; then
            latest=$(ls -t "$WORK"/result-patched-*/build-output/build.log 2>/dev/null | head -1 || true)
          else
            latest=$(ls -t "$WORK"/result-baseline-*/build-output/build.log 2>/dev/null | head -1 || true)
          fi
          if [[ -n "$latest" ]]; then
            cp "$latest" "$WORK/logs/build.log"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ matrix.case }}
          path: ${{ runner.temp }}/buildbench-work/logs/
          if-no-files-found: warn
          retention-days: 7
  report:
    name: 复现汇总
    if: always() && needs.select.result == 'success'
    needs: [select, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: evidence-*
          path: evidence
      - name: 汇总全部任务（缺少证据不能算通过）
        env:
          MATRIX: ${{ needs.select.outputs.matrix }}
        run: |
          set +e
          python3 scripts/summarize_pilot.py evidence results "$MATRIX"
          code=$?
          cat results/results.md >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproduction-summary
          path: results/
          retention-days: 30
