name: BuildBench 原始构建与补丁验证
run-name: BuildBench 复现 / ${{ inputs.selection }}
on:
  workflow_dispatch:
    inputs:
      selection:
        description: >-
          必填：一个或多个 case ID，用英文逗号分隔（逗号前后不要加空格）。
          单个示例：launchpad-kinetic-arm64-amd64-haskell-config-value-4e922fd0713e
          多个示例：launchpad-kinetic-arm64-amd64-haskell-config-value-4e922fd0713e,launchpad-noble-arm64-amd64-globalplatform-df0b1ad38fd5
        required: true
      patch_pr:
        description: >-
          可选：公开 PR 编号（只填数字，例如 12），要求上面的 selection 只填一个 case ID。
          创建方式：从 main 拉分支 → 添加 submissions/<case-id>/change.patch（统一 diff，a/ b/ 前缀，相对解包后源码根目录，不超过 1 MB）→ 向 main 发起 PR，PR 地址 /pull/12 中的 12 就是这里要填的编号。
          示例：selection=launchpad-kinetic-arm64-amd64-haskell-config-value-4e922fd0713e，patch_pr=12
        type: string
        required: false
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.cases.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: cases
        env:
          SELECTION: ${{ inputs.selection }}
          PATCH_PR: ${{ inputs.patch_pr }}
        run: |
          set -euo pipefail
          matrix=$(python3 scripts/select_cases.py "$SELECTION")
          if [[ -n "$PATCH_PR" ]]; then
            [[ "$PATCH_PR" =~ ^[1-9][0-9]*$ ]]
            python3 -c 'import json,sys; m=json.loads(sys.argv[1]); sys.exit(0 if len(m["include"])==1 else 1)' "$matrix"
          fi
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
  build:
    name: build (${{ matrix.case }})
    needs: select
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 355
    env:
      CASE_ID: ${{ matrix.case }}
      BUILDBENCH_LIVE_LOGS: "1"
      PATCH_PR: ${{ inputs.patch_pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.patch_pr != '' && '0' || '1' }}
      - name: Build original source (and validate patch when patch_pr is set)
        env:
          WORK: ${{ runner.temp }}/buildbench-work
        run: |
          set -euo pipefail
          patch=
          if [[ -n "$PATCH_PR" ]]; then
            patch_path="submissions/$CASE_ID/change.patch"
            git fetch --no-tags origin "refs/pull/$PATCH_PR/head"
            sha=$(git rev-parse FETCH_HEAD)
            git show "$sha:$patch_path" > "$runner.temp/change.patch"
            patch="$runner.temp/change.patch"
            test -s "$patch"
            test "$(wc -c < "$patch")" -le 1048576
          fi
          bash scripts/run_case.sh "$CASE_ID" "$WORK" "$patch"
      - name: Summarize
        if: always()
        env:
          EVIDENCE: ${{ runner.temp }}/buildbench-work/evidence
        run: |
          set -euo pipefail
          {
            printf '### %s\n\n' "$CASE_ID"
            if [[ -s "$EVIDENCE/baseline.exit" ]]; then
              printf -- '- 基线退出码：**%s**\n' "$(cat "$EVIDENCE/baseline.exit")"
            fi
            if [[ -s "$EVIDENCE/baseline-result.json" ]]; then
              printf -- '- 历史失败比对：**%s**\n' "$(jq -r '.status' "$EVIDENCE/baseline-result.json")"
            fi
            if [[ -s "$EVIDENCE/patched.exit" ]]; then
              printf -- '- 打补丁后退出码：**%s**\n' "$(cat "$EVIDENCE/patched.exit")"
            fi
            printf '\n完整日志及证据见本 job 的 artifact。\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.case }}
          path: ${{ runner.temp }}/buildbench-work/evidence/
          retention-days: 7
