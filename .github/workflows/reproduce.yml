name: 原始构建与补丁验证
run-name: 原始构建与补丁验证 / ${{ inputs.selection }}
on:
  workflow_dispatch:
    inputs:
      selection:
        description: "必填：一个或多个 case ID，多个时用英文逗号分隔（逗号前后不要加空格）。单个示例：launchpad-kinetic-arm64-amd64-haskell-config-value-4e922fd0713e"
        required: true
      patch_pr:
        description: "可选：公开 PR 编号（只填数字，例如 12），要求上面的 selection 只填一个 case ID。"
        type: string
        required: false
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.cases.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: cases
        env:
          SELECTION: ${{ inputs.selection }}
          PATCH_PR: ${{ inputs.patch_pr }}
        run: |
          set -euo pipefail
          matrix=$(python3 scripts/select_cases.py "$SELECTION")
          if [[ -n "$PATCH_PR" ]]; then
            [[ "$PATCH_PR" =~ ^[1-9][0-9]*$ ]]
            python3 -c 'import json,sys; m=json.loads(sys.argv[1]); sys.exit(0 if len(m["include"])==1 else 1)' "$matrix"
          fi
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
  build:
    name: build (${{ matrix.case }})
    needs: select
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 355
    env:
      CASE_ID: ${{ matrix.case }}
      PATCH_PR: ${{ inputs.patch_pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.patch_pr != '' && '0' || '1' }}
      - name: 准备冻结环境（Release 资产 + 运行时镜像）
        env:
          BUNDLE: ${{ runner.temp }}/buildbench-bundle
        run: |
          set -euo pipefail
          python3 scripts/frozen_release.py fetch "$CASE_ID" "$BUNDLE"
      - name: 原始构建（完整日志）与可选补丁验证
        env:
          BUNDLE: ${{ runner.temp }}/buildbench-bundle
          WORK: ${{ runner.temp }}/buildbench-work
          PATCH_PR: ${{ inputs.patch_pr }}
        run: |
          set -euo pipefail
          patch=
          if [[ -n "$PATCH_PR" ]]; then
            patch_path="submissions/$CASE_ID/change.patch"
            git fetch --no-tags origin "refs/pull/$PATCH_PR/head"
            sha=$(git rev-parse FETCH_HEAD)
            git show "$sha:$patch_path" > "$RUNNER_TEMP/change.patch"
            patch="$RUNNER_TEMP/change.patch"
            test -s "$patch"
            test "$(wc -c < "$patch")" -le 1048576
          fi
          bash scripts/run_frozen_case.sh "$BUNDLE/$CASE_ID" "$WORK" "$(cat "$BUNDLE/runtime-image.txt")" "$patch"
      - name: 汇总
        if: always()
        env:
          WORK: ${{ runner.temp }}/buildbench-work
        run: |
          set -euo pipefail
          {
            printf '### %s\n\n' "$CASE_ID"
            if [[ -s "$WORK/baseline-verdict.json" ]]; then
              printf -- '- 基线判定：**%s**\n' "$(jq -r '.status' "$WORK/baseline-verdict.json")"
              printf -- '- 日志行数：重放 %s 行 / 官方 %s 行（比例 %s）\n' \
                "$(jq -r '.replay_lines' "$WORK/baseline-verdict.json")" \
                "$(jq -r '.reference_lines' "$WORK/baseline-verdict.json")" \
                "$(jq -r '.line_ratio' "$WORK/baseline-verdict.json")"
              printf -- '- 官方失败诊断覆盖：缺失 %s 条，重放多出 %s 条\n' \
                "$(jq -r '[.missing_diagnostics[]] | add // 0' "$WORK/baseline-verdict.json")" \
                "$(jq -r '.extra_diagnostics' "$WORK/baseline-verdict.json")"
            fi
            if [[ -s "$WORK/patched-result.json" ]]; then
              printf -- '- 打补丁后：**成功**，产物 %s 个\n' "$(jq -r '.artifacts | length' "$WORK/patched-result.json")"
            fi
            printf '\n完整基线/补丁日志见本 job 的 artifact（evidence-%s）。\n' "$CASE_ID"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.case }}
          path: |
            ${{ runner.temp }}/buildbench-work/*.log
            ${{ runner.temp }}/buildbench-work/*.json
            ${{ runner.temp }}/buildbench-work/*.exit
            ${{ runner.temp }}/buildbench-work/*.txt
            ${{ runner.temp }}/buildbench-work/result-baseline-*/build-output/build.log
            ${{ runner.temp }}/buildbench-work/result-baseline-*/build-output/build-*.json*
            ${{ runner.temp }}/buildbench-work/result-patched-*/build-output/build.log
            ${{ runner.temp }}/buildbench-work/result-patched-*/build-output/build-*.json*
          retention-days: 7
