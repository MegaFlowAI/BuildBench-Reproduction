name: BuildBench original and patched builds
run-name: BuildBench ${{ inputs.selection }}
on:
  workflow_dispatch:
    inputs:
      selection:
        description: "Case ID, comma-separated IDs, pilot, pending, arm64, amd64, or all"
        default: pending
        required: true
      patch_pr:
        description: "Optional public pull request number; requires a single case ID"
        type: string
        required: false
      variants:
        description: "Run the selected cases' recorded environment variants"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.cases.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: cases
        env:
          SELECTION: ${{ inputs.selection }}
          VARIANTS: ${{ inputs.variants }}
          PATCH_PR: ${{ inputs.patch_pr }}
        run: |
          set -euo pipefail
          matrix=$(python3 scripts/select_cases.py "$SELECTION" "$VARIANTS")
          if [[ -n "$PATCH_PR" ]]; then
            [[ "$VARIANTS" == false && "$GITHUB_REF" == refs/heads/main && "$PATCH_PR" =~ ^[1-9][0-9]*$ ]]
            jq -e --arg case "$SELECTION" '.include | length == 1 and .[0].case == $case' <<< "$matrix"
          fi
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
  build:
    name: build (${{ matrix.case }}, ${{ matrix.runner }}${{ matrix.variant != '' && format(', {0}', matrix.variant) || '' }})
    needs: select
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 355
    env:
      CASE_ID: ${{ matrix.case }}
      VARIANT: ${{ matrix.variant }}
      PATCH_PR: ${{ inputs.patch_pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.patch_pr != '' && '0' || '1' }}
      - name: Run the original build and optionally validate a patch
        env:
          WORK: ${{ runner.temp }}/buildbench-work
        run: |
          set -euo pipefail
          patch=
          mkdir -p "$WORK/evidence"
          if [[ -n "$PATCH_PR" ]]; then
            [[ "$PATCH_PR" =~ ^[1-9][0-9]*$ ]]
            git fetch --no-tags origin "refs/pull/$PATCH_PR/head"
            sha=$(git rev-parse FETCH_HEAD)
            patch_path="submissions/$CASE_ID/change.patch"
            changed=$(git diff --no-renames --name-only "HEAD...$sha")
            if [[ "$changed" != "$patch_path" ]]; then
              echo "The PR must change only $patch_path"
              exit 1
            fi
            patch="$WORK/change.patch"
            test "$(git ls-tree "$sha" -- "$patch_path" | cut -d ' ' -f 1)" = 100644
            git show "$sha:$patch_path" > "$patch"
            test -s "$patch"
            test "$(wc -c < "$patch")" -le 1048576
            printf '%s\n' "$sha" > "$WORK/evidence/patch-commit.txt"
            sha256sum "$patch" > "$WORK/evidence/patch-sha256.txt"
          fi
          bash scripts/run_case.sh "$CASE_ID" "$WORK" "$patch" "$VARIANT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.case }}${{ matrix.variant != '' && format('-{0}', matrix.variant) || '' }}
          path: ${{ runner.temp }}/buildbench-work/evidence/
          retention-days: 7

