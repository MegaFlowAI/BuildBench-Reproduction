name: Recover damaged frozen packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  select:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      files: ${{ steps.select.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: select
        run: |
          files=$(jq -c 'map(select(.asset == null).file) | unique' cases/integrity-repairs.json)
          printf 'files=%s\n' "$files" >> "$GITHUB_OUTPUT"
  recover:
    needs: select
    if: needs.select.outputs.files != '[]'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        file: ${{ fromJSON(needs.select.outputs.files) }}
    env:
      PACKAGE_FILE: ${{ matrix.file }}
    steps:
      - name: Download the original package version
        run: |
          set -euo pipefail
          [[ "$PACKAGE_FILE" =~ ^[a-z0-9][a-z0-9+.-]*_[a-zA-Z0-9.+~:-]+_(arm64|amd64|all)\.deb$ ]]
          source="https://launchpad.net/ubuntu/+archive/primary/+files/$PACKAGE_FILE"
          curl --fail --location --silent --show-error --retry 3 --max-time 1800 \
            "$source" --output "$PACKAGE_FILE"
          dpkg-deb --fsys-tarfile "$PACKAGE_FILE" | tar -tf - >/dev/null
          name=$(dpkg-deb -f "$PACKAGE_FILE" Package)
          version=$(dpkg-deb -f "$PACKAGE_FILE" Version)
          arch=$(dpkg-deb -f "$PACKAGE_FILE" Architecture)
          [[ "${name}_${version##*:}_${arch}.deb" == "$PACKAGE_FILE" ]]
          digest=$(sha256sum "$PACKAGE_FILE" | cut -d ' ' -f 1)
          size=$(stat -c %s "$PACKAGE_FILE")
          asset="recovered-$digest.deb"
          mv "$PACKAGE_FILE" "$asset"
          jq -n --arg source "$source" --arg file "$PACKAGE_FILE" --arg asset "$asset" \
            --arg digest "$digest" --argjson size "$size" \
            '{file:$file,origin:$source,asset:{file:$asset,sha256:$digest,bytes:$size}}' \
            > recovered-package.json
      - name: Publish and verify the recovered asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset=$(jq -r .asset.file recovered-package.json)
          digest=$(jq -r .asset.sha256 recovered-package.json)
          size=$(jq -r .asset.bytes recovered-package.json)
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/frozen-cases-v1" --jq '.id')
          asset_api="repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100"
          find_asset() {
            gh api --paginate "$asset_api" --jq ".[] | select(.name == \"$asset\")"
          }
          remote=$(find_asset)
          if [[ -z "$remote" ]]; then
            gh release upload frozen-cases-v1 "$asset" --repo "$GITHUB_REPOSITORY"
            remote=$(find_asset)
          fi
          jq -e --arg digest "sha256:$digest" --argjson size "$size" \
            '.state == "uploaded" and .size == $size and .digest == $digest' <<< "$remote"
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-${{ matrix.file }}
          path: recovered-package.json
          retention-days: 7
